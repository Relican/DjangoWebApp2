<!DOCTYPE html>
{% load static %}

<html lang="ru">

<head>
    <title>Django Web App</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="apple-touch-icon" href="{% static 'img/apple-icon.png' %}">
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}">
    <!-- Load Require CSS -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <!-- Font CSS -->
    <link rel="stylesheet" href="{% static 'css/boxicon.min.css' %}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap">
    <!-- Load Template CSS -->
    <link rel="stylesheet" href="{% static 'css/templatemo.css' %}">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
    <!--

    TemplateMo 561 Purple Buzz

    https://templatemo.com/tm-561-purple-buzz

    -->
</head>

<body>
<!-- Header -->
<nav id="main_nav" class="navbar navbar-expand-lg navbar-light bg-white shadow">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand h1" href="index.html">
            <i class='bx bx-buildings bx-sm text-dark'></i>
            <span class="text-dark h4">ФОР</span><span class="text-primary h4">УМ</span>
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbar-toggler-success" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="align-self-center collapse navbar-collapse flex-fill  d-lg-flex justify-content-lg-between"
             id="navbar-toggler-success">
            <div class="justify-content-start mx-xl-5 mb-2">
                <ul class="nav navbar-nav d-flex justify-content-between mx-xl-5 text-center text-dark">
                    <li class="nav-item">
                        <a class="nav-link btn-outline-primary rounded-pill px-3" href="/index.html">Главная</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active btn-outline-primary rounded-pill px-3" style="color: white"
                           href="/forum">Форум</a>
                    </li>
                </ul>
            </div>
            <div class="navbar align-self-center d-flex">
                <!-- ВОТ СЮДА ПОТОМ ПРИКРУТИТЬ АВТОРИЗАЦИЮ!-->
                <a class="nav-link" href="forum/register.html"><i class='bx bx-sm text-primary'>{{ request.user }}</i><i class='bx bx-user-circle bx-sm text-primary'></i></a>
                <a class="nav-link" href="/forum/logout/"><i class='bx bx-user-minus bx-sm text-primary'></i></a>
            </div>
        </div>
    </div>
</nav>
<!-- Close Header -->


<!-- Start Service -->
<section class="service-wrapper py-3">
    <div class="container-fluid pb-3">
        <div class="row">
            <h2 class="h2 text-center col-12 py-5 semi-bold-600">{{ topic.topic_theme }}</h2>
            <div class="service-header col-2 col-lg-3 text-end light-300">
            </div>
        </div>
        {% for message in messages %}
        <div class="service-heading col-10 col-lg-9 text-start float-end light-300">
            <h2 class="h3 pb-4 typo-space-line">{{ message.message_text }}</h2>
        </div>
        <p class="service-footer col-10 offset-2 col-lg-9 offset-lg-3 text-start pb-3 text-muted px-2">
            Дата сообщения: {{ message.publish_date }}
        </p>
        <p class="service-footer col-10 offset-2 col-lg-9 offset-lg-3 text-start pb-3 text-muted px-2">
            Автор: {{ message.author }}
        </p>
        {% endfor %}
        <div>
            <form method="post" action="add/">
                {% csrf_token %}
                <div class="row row-cols-1">
                    <div class="col mb-5">

                        {{ message_form.as_p }}

                    </div>
                    <div class="col mb-5">
                        <input type="submit" value="Добавить сообщение"/>
                    </div>
                </div>
            </form>
        </div>
    </div>
</section>

<!-- End Service -->


<!-- Bootstrap -->
<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
<!-- Load jQuery require for isotope -->
<script src="{% static 'js/jquery.min.js' %}"></script>
<!-- Isotope -->
<script src="{% static 'js/isotope.pkgd.js' %}"></script>
<!-- Page Script -->
<script>
    $(window).load(function() {
        // init Isotope
        var $projects = $('.projects').isotope({
            itemSelector: '.project',
            layoutMode: 'fitRows'
        });
        $(".filter-btn").click(function() {
            var data_filter = $(this).attr("data-filter");
            $projects.isotope({
                filter: data_filter
            });
            $(".filter-btn").removeClass("active");
            $(".filter-btn").removeClass("shadow");
            $(this).addClass("active");
            $(this).addClass("shadow");
            return false;
        });
    });
</script>
<!-- Templatemo -->
<script src="{% static 'js/templatemo.js' %}"></script>
<!-- Custom -->
<script src="{% static 'js/custom.js' %}"></script>

</body>

</html>
